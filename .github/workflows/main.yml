
name: Extract Institute Management

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Extract ZIP
        run: |
          ZIP_FILE="Institute-Management.zip"

          if [ ! -f "$ZIP_FILE" ]; then
            echo "ZIP file not found!"
            ls -la
            exit 1
          fi

          unzip -t "$ZIP_FILE"
          unzip -o "$ZIP_FILE" -d ./

      - name: Commit Extracted Files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract Institute Management ZIP" || echo "No changes"
          git push
